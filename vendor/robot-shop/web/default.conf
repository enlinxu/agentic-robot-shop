server {
 listen 8080;
 root /usr/share/nginx/html;
 ssi on;
 location / { try_files $uri $uri/ /index.html; }
 location = /lab { try_files /lab.html =404; }
 location /sre { proxy_pass http://sre-baseline:8080; proxy_read_timeout 210s; }
 location /api/load/ { proxy_pass http://shopping-load:8080/; proxy_read_timeout 120s; }
 location = /assistant { try_files /assistant.html =404; }
 location /api/agent/ { proxy_pass http://shopping-agent:8080/; proxy_read_timeout 120s; }
 location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
 location /api/cart/ { proxy_pass http://cart:8080/; }
 location /api/user/ { proxy_pass http://user:8080/; }
 location /api/ratings/ { return 503 '{"error":"ratings is outside this shopping-path deployment"}'; }
 location /api/shipping/ { return 503 '{"error":"shipping is outside this shopping-path deployment"}'; }
 location /api/payment/ { return 503 '{"error":"checkout is outside this shopping-path deployment"}'; }
}
