apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agentic-robot-shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: ghcr.io/enlinxu/agentic-robot-shop/web:v0.1.0
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_SERVICE_NAME
          value: web
        - name: SHOP_NAMESPACE
          value: agentic-robot-shop
        - name: CLUSTER_NAME
          value: demo
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
          value: http,express,mongodb,redis,redis-4
        - name: PYDANTIC_AI_NO_BANNER
          value: '1'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TRACE_STORE_URL
          value: http://tempo:3200
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: agentic-robot-shop
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
