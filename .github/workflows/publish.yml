name: Publish images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: v0.1.0
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: agent
            context: .
          - service: catalogue
            context: vendor/robot-shop/catalogue
          - service: cart
            context: vendor/robot-shop/cart
          - service: user
            context: vendor/robot-shop/user
          - service: mongodb
            context: vendor/robot-shop/mongo
          - service: web
            context: vendor/robot-shop/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ inputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
